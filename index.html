<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #1e293b;
        --accent1: #38bdf8;
        --accent2: #a78bfa;
        --text: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--text);
        overflow: hidden;
      }

      .scene {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem 4rem;
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
      }

      .glow {
        position: absolute;
        inset: -20%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.28), transparent 55%);
        filter: blur(24px);
        z-index: 0;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(3rem, 8vw, 8rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(90deg, var(--accent1), var(--accent2), #f9a8d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 30px rgba(167, 139, 250, 0.45);
        animation: pulse 2.5s ease-in-out infinite alternate;
      }

      p {
        position: relative;
        z-index: 1;
        margin-top: 1rem;
        font-size: 1.1rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(226, 232, 240, 0.8);
      }

      @keyframes pulse {
        from {
          transform: scale(0.98);
          filter: brightness(1);
        }
        to {
          transform: scale(1.04);
          filter: brightness(1.2);
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="glow"></div>
      <h1>Hello Amit This is your world</h1>
      <p>Welcome</p>
    </div>
  </body>
</html>
